spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://himxfvvjwhhujunzgxkh.supabase.co/auth/v1
          jwk-set-uri: https://himxfvvjwhhujunzgxkh.supabase.co/auth/v1/.well-known/jwks.json
          audiences: authenticated

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
